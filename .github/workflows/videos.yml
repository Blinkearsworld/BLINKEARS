name: Update YouTube videos

# Every 4 hours this reads the BLINKEARS YouTube channel and adds new videos
# to videos.json, which the Watch page (watch.html) shows as an album.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the channel and update videos.json
        run: |
          cat > /tmp/update_videos.py <<'PY'
          #!/usr/bin/env python3
          """Keep videos.json in sync with the BLINKEARS YouTube channel.

          Tries several public sources (no API key needed) and never fails the job:
            1. the channel RSS feed            2. the uploads-playlist RSS feed
            3. the channel's Videos and Shorts pages (reads the page data)
          New videos are added, old ones are kept, so the Watch page album grows by itself.
          """
          import json, os, re, sys, time, urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          CHANNEL_ID = "UCrTKH9dZbPLrf3i7DkP1aDQ"
          HANDLE = "BLINKEARS"
          OUT = "videos.json"
          NS = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015",
                "media": "http://search.yahoo.com/mrss/"}
          HDR = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
                 "Accept-Language": "en-US,en;q=0.9", "Cookie": "CONSENT=YES+1; SOCS=CAI"}

          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=HDR), timeout=30).read()

          def from_rss(url):
              root = ET.fromstring(get(url))
              out = []
              for e in root.findall("a:entry", NS):
                  d = e.find("media:group/media:description", NS)
                  link = e.find("a:link", NS)
                  href = link.get("href", "") if link is not None else ""
                  out.append({"id": e.find("yt:videoId", NS).text,
                              "title": (e.find("a:title", NS).text or "").strip(),
                              "published": e.find("a:published", NS).text,
                              "desc": re.sub(r"\s+", " ", (d.text or "") if d is not None else "").strip()[:220],
                              "short": "/shorts/" in href or None})
              return out

          def page_data(url):
              html = get(url).decode("utf-8", "replace")
              m = re.search(r"var ytInitialData\s*=\s*(\{.*?\});\s*</script>", html, re.S) or \
                  re.search(r"ytInitialData\"\]\s*=\s*(\{.*?\});", html, re.S)
              return json.loads(m.group(1)) if m else {}

          def text_of(t):
              if not isinstance(t, dict):
                  return ""
              if "simpleText" in t:
                  return t["simpleText"]
              if "runs" in t:
                  return "".join(r.get("text", "") for r in t["runs"])
              if "content" in t:
                  return t["content"]
              return ""

          def walk(o):
              if isinstance(o, dict):
                  yield o
                  for v in o.values():
                      yield from walk(v)
              elif isinstance(o, list):
                  for v in o:
                      yield from walk(v)

          def from_page(tab, short):
              data = page_data(f"https://www.youtube.com/channel/{CHANNEL_ID}/{tab}")
              out, seen = [], set()
              for d in walk(data):
                  vid, title = None, ""
                  if "videoRenderer" in d and isinstance(d["videoRenderer"], dict):
                      r = d["videoRenderer"]; vid = r.get("videoId"); title = text_of(r.get("title"))
                  elif "reelItemRenderer" in d and isinstance(d["reelItemRenderer"], dict):
                      r = d["reelItemRenderer"]; vid = r.get("videoId"); title = text_of(r.get("headline"))
                  elif "shortsLockupViewModel" in d and isinstance(d["shortsLockupViewModel"], dict):
                      r = d["shortsLockupViewModel"]
                      for x in walk(r):
                          if "reelWatchEndpoint" in x and isinstance(x["reelWatchEndpoint"], dict):
                              vid = x["reelWatchEndpoint"].get("videoId"); break
                      title = text_of((r.get("overlayMetadata") or {}).get("primaryText")) or \
                              (r.get("accessibilityText") or "").split(",")[0]
                  if vid and vid not in seen and re.fullmatch(r"[\w-]{11}", vid):
                      seen.add(vid)
                      out.append({"id": vid, "title": title.strip(), "published": None, "desc": "", "short": short})
              return out

          def main():
              try:
                  old = json.load(open(OUT, encoding="utf-8"))
              except Exception:
                  old = {"videos": []}
              known = {v["id"]: v for v in old.get("videos", [])}
              found = {}

              sources = [
                  ("channel feed", lambda: from_rss(f"https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL_ID}")),
                  ("uploads feed", lambda: from_rss(f"https://www.youtube.com/feeds/videos.xml?playlist_id=UU{CHANNEL_ID[2:]}")),
                  ("videos page", lambda: from_page("videos", False)),
                  ("shorts page", lambda: from_page("shorts", True)),
              ]
              for name, fn in sources:
                  try:
                      items = fn()
                      print(f"{name}: {len(items)} videos")
                      for i, v in enumerate(items):
                          cur = found.get(v["id"])
                          if cur is None:
                              found[v["id"]] = v
                          else:
                              for k in ("title", "published", "desc"):
                                  if v.get(k) and not cur.get(k):
                                      cur[k] = v[k]
                              if v.get("short") is not None:
                                  cur["short"] = v["short"]
                  except Exception as e:
                      print(f"{name}: could not read ({e})")

              if not found:
                  print("No videos found from any source. Nothing changed; will try again next time.")
                  return 0

              now = time.time()
              changed = False
              for i, (vid, v) in enumerate(found.items()):
                  if not v.get("published"):
                      v["published"] = datetime.fromtimestamp(now - i, timezone.utc).isoformat()
                  k = known.get(vid)
                  if k is None:
                      known[vid] = {"id": vid, "title": v.get("title") or "BLINKEARS", "published": v["published"],
                                    "desc": v.get("desc", ""), "short": bool(v.get("short"))}
                      changed = True
                      print("new:", vid, v.get("title"))
                  else:
                      for key in ("title", "desc"):
                          if v.get(key) and k.get(key) != v[key]:
                              k[key] = v[key]; changed = True
                      if v.get("short") is not None and k.get("short") != bool(v["short"]):
                          k["short"] = bool(v["short"]); changed = True

              vids = sorted(known.values(), key=lambda v: v["published"], reverse=True)
              if changed:
                  with open(OUT, "w", encoding="utf-8") as f:
                      json.dump({"channel": CHANNEL_ID, "videos": vids}, f, ensure_ascii=False, indent=1)
                  print(f"videos.json updated ({len(vids)} videos)")
              else:
                  print("no changes")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 /tmp/update_videos.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "blinkears-bot"
            git config user.email "blinkears-bot@users.noreply.github.com"
            git add videos.json
            git commit -m "Update YouTube videos"
            git push
          else
            echo "Nothing new"
          fi
