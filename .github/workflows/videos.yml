name: Update YouTube videos

# Every 4 hours this reads the BLINKEARS YouTube channel and adds new videos
# to videos.json, which the Watch page (watch.html) shows as an album.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the channel and update videos.json
        run: |
          cat > /tmp/update_videos.py <<'PY'
          #!/usr/bin/env python3
          """Keep videos.json in sync with the BLINKEARS YouTube channel.

          Runs on GitHub Actions every few hours. Reads the channel's public RSS feed
          (latest 15 uploads), adds any new videos to videos.json and keeps the old ones,
          so the Watch page album grows by itself.
          """
          import json, os, re, sys, urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          CHANNEL_ID = "UCrTKH9dZbPLrf3i7DkP1aDQ"
          FEED = f"https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL_ID}"
          OUT = "videos.json"
          NS = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015",
                "media": "http://search.yahoo.com/mrss/"}
          UA = {"User-Agent": "Mozilla/5.0 (blinkears.com video list updater)"}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None

          def is_short(vid):
              """A Short answers /shorts/<id> directly; a normal video redirects to /watch."""
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  r = opener.open(urllib.request.Request(f"https://www.youtube.com/shorts/{vid}", headers=UA), timeout=20)
                  return r.status == 200
              except urllib.error.HTTPError as e:
                  return False
              except Exception:
                  return None

          def main():
              try:
                  old = json.load(open(OUT, encoding="utf-8"))
              except Exception:
                  old = {"videos": []}
              known = {v["id"]: v for v in old.get("videos", [])}

              xml = urllib.request.urlopen(urllib.request.Request(FEED, headers=UA), timeout=30).read()
              root = ET.fromstring(xml)
              changed = False
              for e in root.findall("a:entry", NS):
                  vid = e.find("yt:videoId", NS).text
                  title = (e.find("a:title", NS).text or "").strip()
                  published = e.find("a:published", NS).text
                  desc_el = e.find("media:group/media:description", NS)
                  desc = (desc_el.text or "").strip() if desc_el is not None else ""
                  desc = re.sub(r"\s+", " ", desc)[:220]
                  v = known.get(vid)
                  if v is None:
                      short = is_short(vid)
                      known[vid] = {"id": vid, "title": title, "published": published, "desc": desc,
                                    "short": bool(short)}
                      changed = True
                      print("new:", vid, title, "short" if short else "")
                  elif v.get("title") != title or v.get("desc") != desc:
                      v["title"], v["desc"] = title, desc
                      changed = True

              vids = sorted(known.values(), key=lambda v: v["published"], reverse=True)
              if changed or not os.path.exists(OUT):
                  with open(OUT, "w", encoding="utf-8") as f:
                      json.dump({"channel": CHANNEL_ID, "videos": vids}, f, ensure_ascii=False, indent=1)
                  print(f"videos.json updated ({len(vids)} videos)")
              else:
                  print("no changes")

          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 /tmp/update_videos.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "blinkears-bot"
            git config user.email "blinkears-bot@users.noreply.github.com"
            git add videos.json
            git commit -m "Update YouTube videos"
            git push
          else
            echo "Nothing new"
          fi
